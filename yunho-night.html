BG recording
N 스튜디오의 문이 완전히 닫히자 바깥 세상의 자동차 소음과 바람 소리가 거짓말처럼 차단되었다.

Y 도망치지 않는다고 했잖아요.
Y 형이 먼저 멈추지 마요.

Y 읏… 형, 아파요.
HJ 아프라고 한 거야. 기억하라고.

E 특수 엔딩/DREAM|SPECIAL END — DREAM|윤호는 스물아홉 살에 첫 솔로 앨범을 냈다. 크게 성공하지는 않았지만 노래는 누군가의 새벽에 오래 남았다.||연습화는 앨범 재킷의 맨 구석에 작게 찍혀 있었다. 7년을 박스 맨 밑에 있던 신발이 비로소 햇빛을 본 것이다.||윤호는 노래하는 사람으로 살기 시작했다. 늦었다고 말하는 사람은 아무도 없었다.
# z_night
BG bar
N 영업 시작 10분 전. 윤호는 거울 앞에서 눈꼬리를 휘었다. 한 실장은 가게 열쇠를 윤호의 손에 올려놓았다.
E 특수 엔딩/NIGHT|SPECIAL END — NIGHT|윤호는 앙코르의 책임자가 되었다. 한 실장의 자리를 이어받았고, 우영과 동혁과 직원들을 챙겼다.||웃음은 능숙하게 얹혔고 가끔 일부러 거두어졌다. 밤을 선택한 사람의 얼굴은 낮에도 단단했다.||이 가게에서 사람들은 하루를 견뎠다. 윤호는 그 하루의 끝을 지키는 사람이 되었다.
# z_solo
BG rooftop
N 3호 빌딩 옥상에서 윤호는 새해 첫 일출을 보았다. 이번에도 혼자였다. 하지만 이번에는 혼자라는 말이 외롭다는 말과 같지 않았다.
? 마지막으로 윤호는
- 연습화를 신고 옥상을 걷는다|rs+2||N 밑창이 닳은 신발이 처음으로 제 길을 걸었다.
- 신발을 박스에 다시 넣는다|rs-1||N 박스 뚜껑을 닫는 소리가 조용히 울렸다.
- 하늘을 오래 올려다본다|rs+1||N 해가 천천히 떴다.
% rs 6 a
% rs 3 b
E 단독 루트/오늘도 밤은 온다|NORMAL END — 오늘도 밤은 온다|윤호는 아무것도 바꾸지 못했다. 낮에는 자고 밤에는 가게로 나갔다. 박스 맨 밑의 연습화는 그대로였다.||하지만 오늘의 웃음은 어제보다 조금 느리게 올라왔다. 그 차이를 알아보는 사람은 없었다.||오늘도 밤은 오고, 윤호는 문을 열고 나선다. 내일은 모르는 채로.
# a
E 단독 루트/정윤호|TRUE END — 정윤호|윤호는 호스트라는 이름도, 연습생이라는 이름도 내려놓았다. 이름표 없이 이름만 남은 사람이 되었다.||그날 밤 윤호는 거울 앞에서 한참 입가를 만지작거리다 천천히 손을 뗐다. 웃지도 거두지도 않은 채 거울 속의 자기 얼굴을 바라보았다.||그 얼굴은 서른에 가까운 남자의 얼굴이었다. 웃고 있지는 않았지만, 괜찮아 보였다.
# b
E 단독 루트/새로운 시작|GOOD END — 새로운 시작|윤호는 가게를 정리하고 작은 카페에서 일하기 시작했다. 서툴렀고 자주 실수했지만 아무도 윤호에게 웃으라고 하지 않았다.||연습화는 방 한가운데에 놓여 있었다. 가끔 신어 보기도 했다. 밑창은 낡았지만 걷기에는 충분했다.||새로운 시작은 거창하지 않았다. 아침에 일어나 컵을 씻고 뒤집어 놓는 일. 그 정도면 충분했다.
`;


const SPK={Y:'윤호',J:'종호',SH:'성화',HJ:'홍중',YS:'여상',SN:'산',MG:'민기',WY:'우영',IM:'임 대표',HS:'한 실장',DH:'동혁'};
let UID=0;
function fxp(s){const o={};(s||'').replace(/([a-z]+)([+-]\d+)/g,(m,k,v)=>{o[k]=(o[k]||0)+ +v});return o}
function ln(s,lab){
  s=s.trim();const m=s.match(/^(\S+) ?([\s\S]*)$/);const c=m[1],t=m[2];
  if(c==='N')return N(t);if(c==='I')return I(t);
  if(SPK[c])return SP(SPK[c],t);
  if(c[0]==='@')return SP(c.slice(1),t);
  if(c==='BG')return BG(t);
  {const cm=s.match(/^CUT\(?\s*(\d+)\s*\)?,?$/);if(cm)return CUT(+cm[1])}
  if(c==='#')return L(lab(t));
  if(c==='>')return GO(lab(t));
  if(c==='$')return FX(fxp(t));
  if(c==='!')return FL(t);
  if(c==='^'){const a=t.split(' ');return IF(a[0],lab(a[1]))}
  if(c==='%'){const a=t.split(' ');return {ge:[a[0],+a[1],lab(a[2])]}}
  if(c==='*'){const a=t.split(' ');const k=a[0];
    if(k==='NX')return {nx:+a[1]};if(k==='PICK')return {pick:1};if(k==='ROUTE')return {route:1};if(k==='SOLO')return {solo:1};
    if(k==='FAVGO')return {favgo:lab(a[1])};if(k==='KGO')return {kgo:lab(a[1])}}
  if(c==='E'){const i1=t.indexOf('|'),i2=t.indexOf('|',i1+1);return {ending:[t.slice(0,i1).trim(),t.slice(i1+1,i2).trim(),t.slice(i2+1).trim()]}}
  throw new Error('bad line: '+s);
}
/* 19세 이상 장면 슬롯: <script type="text/plain" id="adult-키"> 안의 줄을 읽어옴. 코드 없는 줄은 자동으로 서술(N) 처리 */
function adultLines(k){const el=document.getElementById('adult-'+k);if(!el)return[];
  return el.textContent.split('\n').map(x=>x.trim()).filter(x=>x&&x.slice(0,2)!==';;').map(x=>{
    x=x.replace(/^([A-Z]{1,2})\s*[:：]\s*/,(m,c)=>(SPK[c]||c==='N'||c==='I')?c+' ':m);
    const c=x.split(/\s/)[0];
    if(c==='N'||c==='I'||c==='BG'||c==='E'||SPK[c]||/^CUT/.test(c)||'@#>$!^%*?-'.includes(c[0]))return x;
    return 'N '+x})}
function P(text,pre){
  const lab=x=>x==='END'?'r_end':pre+x,out=[];
  const Ls=[];text.split('\n').map(x=>x.trim()).filter(x=>x&&x.slice(0,2)!==';;').forEach(x=>{const m=x.match(/^@@ADULT (\w+)$/);if(m)Ls.push(...adultLines(m[1]));else Ls.push(x)});
  for(let i=0;i<Ls.length;i++){const s=Ls[i];
    if(s[0]==='?'){const op=[];while(Ls[i+1]&&(Ls[i+1][0]==='-'||(/^CUT\(\d+\)$/.test(Ls[i+1])&&op.length&&Ls[i+2]&&Ls[i+2][0]==='-'))){
      if(Ls[i+1][0]==='-')op.push(Ls[++i].slice(1).trim().split('|').map(x=>x.trim()));
      else{const o=op[op.length-1];while(o.length<4)o.push('');o[3]=(o[3]?o[3]+'//':'')+Ls[++i]}}
      const id=pre+'q'+(UID++),jn=id+'j';
      out.push(CH(s.slice(1).trim(),op.map((o,k)=>({t:o[0],go:id+k,fx:fxp(o[1]),flag:o[2]||undefined}))));
      op.forEach((o,k)=>{out.push(L(id+k));(o[3]||'').split('//').forEach(x=>{if(x.trim())out.push(ln(x,lab))});out.push(GO(jn))});
      out.push(L(jn));continue}
    out.push(ln(s,lab))}
  return out}
const PARTS=n=>n<7?'1부 · 새로운 일상':n<13?'2부 · 다시 만난 사람들':n<19?'3부 · 가까워지는 관계':n<25?'4부 · 감정의 충돌':n<28?'5부 · 선택':'6부 · 개인 루트';
const pad=n=>String(n).padStart(2,'0');
for(const n in C){SCRIPTS[n]=[{card:['CHAPTER '+pad(n),C[n][0],PARTS(+n)]},...P(C[n][1],'')];if(+n<=27)SCRIPTS[n].push({nx:+n+1});CHTITLE[n]='CHAPTER '+pad(n)+' — '+C[n][0]}
for(const n of [28,29,30]){const a=[{favgo:'r'}];
  for(const k in RT[n]){a.push(L('r_'+k),{card:['CHAPTER '+n,RTT[n][k],PARTS(n)]},...P(RT[n][k],k+n+'_'))}
  a.push(L('r_end'));if(n<30)a.push({nx:n+1});SCRIPTS[n]=a;CHTITLE[n]='CHAPTER '+n+' — 개인 루트'}

const LBL={};for(const k in SCRIPTS){LBL[k]={};SCRIPTS[k].forEach((e,i)=>{if(e.L)LBL[k][e.L]=i})}

/* ---------- engine ---------- */
const $=id=>document.getElementById(id);
const NC={'윤호':'var(--c-yunho)','종호':'var(--c-jongho)','성화':'var(--c-seonghwa)','홍중':'#f2c46d','여상':'#b9d98a','산':'#8fb5e8','민기':'#c9a0e0','우영':'#ff9f68','임 대표':'#d4c5a0','한 실장':'#a8b5c8','동혁':'#9fc5c0'};
let S=null,typing=null,autoT=null,autoOn=false,skipOn=false,skipT=null,lineCount=0;
const cfg=Object.assign({speed:1,auto:2200,size:100},store.get('cfg',{}));
function applyCfg(){document.documentElement.style.setProperty('--fs',cfg.size/100);store.set('cfg',cfg)}
applyCfg();
const SPD=[60,30,14,0];

function freshState(){return {ch:1,pc:0,bg:null,rel:{jongho:0,seonghwa:0,mask:0},flags:{},last:null,log:[],fav:null,route:null,kind:null}}
function snap(){const c=JSON.parse(JSON.stringify(S));c.log=c.log.slice(-60);return c}
function seenMax(){return (store.get('seen',{})[S.ch]||0)}
function markSeen(){const s=store.get('seen',{});if((s[S.ch]||0)<S.pc){s[S.ch]=S.pc;store.set('seen',s)}}

function run(){
  const sc=SCRIPTS[S.ch];
  while(S.pc<sc.length){
    const e=sc[S.pc++];
    if(e.L)continue;
    if(e.nx){const c=store.get('cleared',[]);if(!c.includes(S.ch)){c.push(S.ch);store.set('cleared',c)}S.ch=e.nx;S.pc=0;clearStage();run();return}
    if(e.pick){let b='none',m=4;for(const x of KEYS){if((S.rel[x]||0)>m){m=S.rel[x];b=x}}S.fav=b;continue}
    if(e.favgo){S.pc=LBL[S.ch][e.favgo+'_'+(S.route||S.fav||'none')];continue}
    if(e.route){const f=S.fav||'none';S.route=(S.flags.retreat||f==='none')?'none':f;S.rel.rs=S.route==='none'?0:Math.max(0,Math.min(2,Math.floor(((S.rel[f]||0)-5)/2)));continue}
    if(e.solo){const r=S.rel;let tot=0,hi=0;for(const x of KEYS){tot+=r[x]||0;if((r[x]||0)>=3)hi++}const d=(r.dream||0)-(r.night||0);S.kind=d>=3?'dream':-d>=3?'night':hi>=4?'all':tot<8?'lonely':'solo';continue}
    if(e.kgo){S.pc=LBL[S.ch][e.kgo+'_'+S.kind];continue}
    if(e.ge){if((S.rel[e.ge[0]]||0)>=e.ge[1])S.pc=LBL[S.ch][e.ge[2]];continue}
    if(e.if!==undefined){if(S.flags[e.if])S.pc=LBL[S.ch][e.go];continue}
    if(e.go){S.pc=LBL[S.ch][e.go];continue}
    if(e.bg){setBg(e.bg);continue}
    if(e.cut){setBg('cut'+e.cut);continue}
    if(e.fx){applyFx(e.fx);continue}
    if(e.flag){S.flags[e.flag]=1;continue}
    show(e);return;
  }
}
const KEYS=['hongjung','seonghwa','yeosang','san','mingi','wooyoung','jongho'];
function applyFx(o){for(const k in o)S.rel[k]=(S.rel[k]||0)+o[k]}
function clearStage(){$('stage').innerHTML=''}
function show(e,instant){
  $('tbwrap').classList.remove('choice-open');
  S.last=e;
  $('game').classList.remove('cardon');
  const fresh=!instant;
  if(fresh){markSeen();lineCount++}
  clearTimeout(autoT);
  if(e.card){clearStage();renderCard(e.card);if(fresh)store.set('auto',snap());return}
  if(e.ending){clearStage();renderEnding(e.ending);store.set('auto',snap());return}
  if(e.end){clearStage();renderEnd();store.set('auto',snap());return}
  if(e.c){clearStage();$('tbwrap').classList.add('choice-open');renderChoices(e);if(fresh)store.set('auto',snap());return}
  clearStage();
  const kind=e.n?'n':e.i?'i':'s';
  const text=e.n||e.i||e.t;
  const who=e.n?null:(e.i?'윤호':e.s);
  const nm=$('nm');
  if(who){nm.hidden=false;$('nmt').textContent=who;nm.style.setProperty('--nc',NC[who]||'var(--c-etc)')}else nm.hidden=true;
  const t=$('txt');t.className='txt '+kind;
  if(fresh)S.log.push({s:who||'',t:text});
  if(S.log.length>300)S.log.shift();
  $('nx').hidden=true;
  type(t,text,instant);
  if(fresh&&lineCount%14===0)store.set('auto',snap());
}
function type(el,text,instant){
  clearInterval(typing);typing=null;
  const sp=SPD[cfg.speed];
  if(instant||sp===0||skipOn){el.textContent=text;done();return}
  let i=0;el.textContent='';
  typing=setInterval(()=>{i+=1;el.textContent=text.slice(0,i);if(i>=text.length){clearInterval(typing);typing=null;done()}},sp);
  el._full=text;
}
function finishTyping(){if(!typing)return;clearInterval(typing);typing=null;const el=$('txt');const e=S.last;el.textContent=e.n||e.i||e.t;done()}
function done(){
  $('nx').hidden=false;
  if(autoOn){clearTimeout(autoT);autoT=setTimeout(advance,cfg.auto)}
}
function overlayOpen(){return !!$('layer').firstChild}
function advance(){
  if(!S||overlayOpen())return;
  if(typing){finishTyping();return}
  const l=S.last;if(!l||l.c||l.end||l.ending)return;
  run();
}
function renderCard(c){
  const d=document.createElement('div');d.className='card';
  d.innerHTML=`<div class="k"></div><h2></h2><p></p>`;
  d.children[0].textContent=c[0];d.children[1].textContent=c[1];d.children[2].textContent=c[2]||'';
  d.addEventListener('click',()=>{if(S.last===S.last&&S.last.card)run()});
  $('stage').appendChild(d);
  $('game').classList.add('cardon');
  $('txt').textContent='';$('nm').hidden=true;$('nx').hidden=true;
  stopAutoSkip(true);
}
function renderChoices(e){
  $('txt').textContent='';$('nm').hidden=true;$('nx').hidden=true;
  stopAutoSkip(true);
  const w=document.createElement('div');w.className='choices';
  if(e.q){const q=document.createElement('div');q.className='q';q.textContent=e.q;w.appendChild(q)}
  e.c.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=o.t;b.addEventListener('click',ev=>{ev.stopPropagation();pick(o)});w.appendChild(b)});
  $('stage').appendChild(w);
  w.querySelector('.choice').focus({preventScroll:true});
}
function pick(o){
  $('tbwrap').classList.remove('choice-open');
  S.log.push({s:'선택',t:o.t});
  if(o.fx)applyFx(o.fx);
  if(o.flag)S.flags[o.flag]=1;
  clearStage();
  S.pc=LBL[S.ch][o.go];
  run();
}
function memo(){
  const r=S.rel,L=[];
  L.push(r.jongho>=2?`종호는 윤호를 '신경 쓰이는 세입자'쯤으로 다시 적어 두었다. 아직 이름 붙일 만한 사이는 아니다.`:r.jongho>=1?`종호는 윤호에 대한 평가를 보류했다. 물어보지 않는 대신, 계속 보고 있다.`:`종호의 눈은 여전히 날카롭다. 윤호는 아직 '대충은 아는 사람'에게 읽히고 있다.`);
  L.push(r.seonghwa>=1?`성화는 윤호의 새 주소를 기억했다. 그것이 걱정인지 관리인지는 아직 윤호도 모른다.`:`성화는 윤호의 새 주소를 알게 됐다. 이유는 묻지 않았다.`);
  L.push(r.mask>=3?`오늘 윤호는 자주 웃었다. 웃지 않는 얼굴을 본 사람은 아직 없다.`:`윤호는 오늘 몇 번, 꾸미지 않은 얼굴로 말했다.`);
  return L;
}
function renderEnding(a){
  stopAutoSkip(true);
  const ps=a[2].split('||');
  const d=document.createElement('div');d.className='endcard';
  d.innerHTML='<div class="in"><div class="kicker" style="font-size:.78rem;letter-spacing:.28em;color:var(--lamp)"></div><h2></h2><div class="memo">'+ps.map(()=>'<p></p>').join('')+'</div><div class="btnrow"><button class="btn" id="eMenu">메뉴로</button></div></div>';

}
function renderEnd(){
  stopAutoSkip(true);
  const d=document.createElement('div');d.className='endcard';
  const ms=memo().map(t=>`<p style="margin:0"></p>`).join('');
  d.innerHTML=`<div class="in"><div class="kicker" style="font-size:.78rem;letter-spacing:.28em;color:var(--lamp)">CHAPTER 01 COMPLETE</div><h2>새로운 방</h2><div class="memo">${ms}</div><p class="note">다음 이야기, CHAPTER 02 — 에이스는 준비 중입니다. 지금의 선택과 관계는 저장 데이터에 그대로 이어집니다.</p><div class="btnrow"><button class="btn" id="eSave">저장하기</button><button class="btn" id="eMenu">메뉴로</button></div></div>`;
  d.querySelectorAll('.memo p').forEach((p,i)=>p.textContent=memo()[i]);
  $('stage').appendChild(d);
  $('eSave').onclick=()=>openSlots('save');$('eMenu').onclick=toMenu;
  const c=store.get('cleared',[]);if(!c.includes(S.ch)){c.push(S.ch);store.set('cleared',c)}
}

/* ---------- auto / skip ---------- */
function stopAutoSkip(quiet){autoOn=false;skipOn=false;clearTimeout(autoT);clearInterval(skipT);$('tAuto').classList.remove('on');$('tSkip').classList.remove('on')}
$('tAuto').onclick=()=>{if(!S)return;const on=!autoOn;stopAutoSkip();autoOn=on;$('tAuto').classList.toggle('on',on);if(on&&!typing)done()};
$('tSkip').onclick=()=>{if(!S)return;const on=!skipOn;stopAutoSkip();skipOn=on;$('tSkip').classList.toggle('on',on);
  if(on)skipT=setInterval(()=>{if(overlayOpen())return;if(typing)finishTyping();const l=S.last;if(!l||l.c||l.end||l.card){stopAutoSkip();return}if(S.pc<seenMax())run();else stopAutoSkip()},70)};

function closeLayer(){$('layer').innerHTML=''}
function modal(title,build){
  closeLayer();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="panel" role="dialog" aria-modal="true"><header><h3></h3><button class="x" aria-label="닫기">×</button></header><div class="body"></div></div>`;
  m.querySelector('h3').textContent=title;
  m.querySelector('.x').onclick=closeLayer;
  m.addEventListener('click',e=>{if(e.target===m)closeLayer()});
  build(m.querySelector('.body'));
  $('layer').appendChild(m);
  m.querySelector('.x').focus();
}
function openLog(){modal('로그',b=>{const lg=S?S.log:[];if(!lg.length){b.textContent='아직 기록이 없습니다.';return}lg.forEach(x=>{const d=document.createElement('div');d.className='logline';if(x.s){const n=document.createElement('b');n.textContent=x.s;d.appendChild(n)}d.appendChild(document.createTextNode(x.t));b.appendChild(d)});setTimeout(()=>b.scrollTop=b.scrollHeight,0)})}
function openSlots(mode){
  if(mode==='save'&&!S)return;
  modal(mode==='save'?'저장':'불러오기',b=>{
    const slots=store.get('slots',{});
    const mk=(id,label)=>{
      const v=slots[id];const bt=document.createElement('button');bt.className='slot';
      const info=v?`${CHTITLE[v.st.ch]||''} · ${v.when}`:'비어 있음';
      bt.innerHTML=`<span><strong></strong><small></small></span><span style="color:var(--lamp);font-size:.85rem"></span>`;
      bt.querySelector('strong').textContent=label;bt.querySelector('small').textContent=info+(v&&v.snip?` · ${v.snip}`:'');
      bt.lastChild.textContent=mode==='save'?'저장':(v?'불러오기':'');
      bt.onclick=()=>{
        if(mode==='save'){const l=S.log[S.log.length-1];slots[id]={st:snap(),when:new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),snip:l?l.t.slice(0,26):''};store.set('slots',slots);openSlots('save')}
        else if(v)loadState(v.st);
      };
      b.appendChild(bt);
    };
    for(let i=1;i<=8;i++)mk('s'+i,'슬롯 '+i);
    if(mode==='load'){const a=store.get('auto',null);if(a){const bt=document.createElement('button');bt.className='slot';bt.innerHTML=`<span><strong>자동 저장</strong><small></small></span><span style="color:var(--lamp);font-size:.85rem">불러오기</span>`;bt.querySelector('small').textContent=CHTITLE[a.ch]||'';bt.onclick=()=>loadState(a);b.insertBefore(bt,b.firstChild)}}
  });
}
function openSettings(){
  modal('설정',b=>{
    b.innerHTML=`<div class="set"><label for="sSpeed">텍스트 속도</label><select id="sSpeed"><option value="0">느리게</option><option value="1">보통</option><option value="2">빠르게</option><option value="3">즉시</option></select></div>
    <div class="set"><label for="sAuto">자동 진행 대기 시간 <span id="vAuto"></span></label><input type="range" id="sAuto" min="800" max="5000" step="200"></div>
    <div class="set"><label for="sSize">글자 크기 <span id="vSize"></span></label><input type="range" id="sSize" min="85" max="140" step="5"></div>`;
    const sp=b.querySelector('#sSpeed'),au=b.querySelector('#sAuto'),sz=b.querySelector('#sSize');
    sp.value=cfg.speed;au.value=cfg.auto;sz.value=cfg.size;
    const lab=()=>{b.querySelector('#vAuto').textContent=(au.value/1000).toFixed(1)+'초';b.querySelector('#vSize').textContent=sz.value+'%'};lab();
    sp.onchange=()=>{cfg.speed=+sp.value;applyCfg()};au.oninput=()=>{cfg.auto=+au.value;lab();applyCfg()};sz.oninput=()=>{cfg.size=+sz.value;lab();applyCfg()};
  });
}
function openGallery(){
  modal('갤러리',b=>{
    const u=store.get('bgs',[]);
    const p=document.createElement('p');p.className='note';p.textContent=`배경 ${u.filter(k=>BGN[k]).length} / ${Object.keys(BGN).length} 수집. 장면에서 한 번 이상 본 배경이 열립니다.`;b.appendChild(p);
    const g=document.createElement('div');g.className='gal';
    Object.keys(BGN).forEach(k=>{const f=document.createElement('figure');const t=document.createElement('div');t.className='th';
      if(u.includes(k))t.innerHTML=svgBg(k);else t.textContent='?';
      const c=document.createElement('figcaption');c.textContent=u.includes(k)?BGN[k]:'미공개';f.appendChild(t);f.appendChild(c);g.appendChild(f)});
    b.appendChild(g);
  });
}
const ENDS=[
 ['김홍중 루트',['다시 시작','지금의 우리','그때처럼']],
 ['박성화 루트',['너만은','밤이 끝나면','선을 넘지 못해서','같은 밤']],
 ['강여상 루트',['돌아갈 곳','우리답게','너무 늦게','룸메이트']],
 ['최산 루트',['네가 선택한 삶','천천히','그만해']],
 ['송민기 루트',['오래된 사람','여전히 우리','친구로','모르는 사람']],
 ['정우영 루트',['1위','라이벌','패배']],
 ['최종호 루트',['같은 집','옆집 사람','계약 종료']],
 ['단독 루트',['정윤호','새로운 시작','오늘도 밤은 온다']],
 ['특수 엔딩',['ALL RELATIONSHIP','LONELY BAD','DREAM','NIGHT']]];
function openEndings(){
  modal('엔딩 리스트',b=>{
    const got=store.get('ends',[]);const tot=ENDS.reduce((a,x)=>a+x[1].length,0);
    const p=document.createElement('p');p.className='note';p.textContent=`엔딩 ${got.length} / ${tot}. 개인 루트는 CHAPTER 이십칠 이후 열립니다. 제목은 도달하면 공개됩니다.`;b.appendChild(p);
    ENDS.forEach(([r,es])=>{const d=document.createElement('div');d.className='route';const h=document.createElement('h4');h.textContent=r;const ul=document.createElement('ul');
      es.forEach(e=>{const li=document.createElement('li');const k=r+'/'+e;if(got.includes(k)){li.className='got';li.textContent=e}else li.textContent='???';ul.appendChild(li)});
      d.appendChild(h);d.appendChild(ul);b.appendChild(d)});
  });
}

/* ---------- wiring ---------- */
$('mStart').onclick=startNew;
$('mCont').onclick=()=>{const a=store.get('auto',null);if(a)loadState(a)};
$('mSet').onclick=openSettings;$('mGal').onclick=openGallery;$('mEnd').onclick=openEndings;
$('tSet').onclick=openSettings;
$('tb').addEventListener('click',advance);
$('stage').addEventListener('click',e=>{if(e.target.id==='stage')advance()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(overlayOpen())closeLayer();return}
  if(!S||$('game').hidden||overlayOpen())return;
  if(e.key===' '||e.key==='Enter'){if(document.activeElement&&document.activeElement.tagName==='BUTTON')return;e.preventDefault();advance()}
  if(S.last&&S.last.c&&/^[1-4]$/.test(e.key)){const o=S.last.c[+e.key-1];if(o)pick(o)}
});
setBg('street');refreshMenu();
