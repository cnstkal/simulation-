<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>폐허의 온도</title><meta name="color-scheme" content="dark">
<style>
:root{--bg:#0d0f12;--p:#171a1f;--tx:#e6e2da;--dim:#8a8f98;--ac:#c9a66b;--ln:#2a2f37;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto}
#bar{display:flex;flex-wrap:wrap;gap:4px 10px;padding:6px 10px;font-size:12px;color:var(--dim);background:var(--p);border-bottom:1px solid var(--ln)}
#bar b{color:var(--tx);font-weight:600}
#mn{display:flex;gap:6px;padding:6px 10px;background:var(--p)}
button{background:#22262d;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;min-height:40px;cursor:pointer}
button.on{border-color:var(--ac);color:var(--ac)}button:disabled{opacity:.35}
#st{flex:1;position:relative;overflow:hidden;transition:background .6s}
#cs{position:absolute;left:0;right:0;bottom:0;max-height:100%;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,#000a 40%)}
#cs button{text-align:left;min-height:48px;background:#14171cee}
#tt{position:absolute;top:10px;right:10px;font-size:13px;color:var(--ac);text-align:right;pointer-events:none;white-space:pre-line}
#bx{background:var(--p);border-top:2px solid var(--ac);padding:12px 14px 16px;min-height:150px}
#nm{color:var(--ac);font-weight:700;min-height:1.7em}
#tx{white-space:pre-wrap;font-size:16px}
#md{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.mc{background:var(--p);border:1px solid var(--ln);border-radius:12px;padding:16px;max-width:560px;width:100%;max-height:85%;overflow-y:auto;font-size:14px}
.mc p{margin:6px 0}.mc .r{border-top:1px solid var(--ln);padding:8px 0;color:var(--dim)}
.mc .r b{color:var(--tx)}.sl{display:flex;gap:6px;align-items:center;margin:6px 0}.sl span{flex:1;font-size:13px;color:var(--dim)}
</style></head><body><div id="app">
<div id="bar"></div>
<div id="mn"><button onclick="lg()">로그</button><button id="ba" onclick="tg('auto')">자동</button><button id="bs" onclick="tg('skip')">스킵</button><button onclick="rl()">관계</button><button onclick="sm()">저장</button></div>
<div id="st"><div id="tt"></div><div id="cs"></div></div>
<div id="bx"><div id="nm"></div><div id="tx"></div></div></div>
<div id="md"></div>

<script>
const $=s=>document.querySelector(s),K='pa_'+GAME.id+'_';
const db={g:k=>{try{return JSON.parse(localStorage.getItem(K+k))}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(K+k,JSON.stringify(v))}catch(e){}}};
const E=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const R0=()=>({l:0,t:0,c:0,d:0,x:0});
const init=()=>({ch:0,sc:'start',res:{food:2,water:1,med:1,tool:0,ammo:0,hp:100,fat:20,safe:30,morale:50},rel:Object.fromEntries(IDS.map(i=>[i,{a:R0(),y:R0()}])),fl:{},met:{},log:[]});
let S,cur,wait=true,auto=0,skip=0,T,tt;
function bar(){const r=S.res;$('#bar').innerHTML=Object.keys(LB).map(k=>`${LB[k]} <b>${r[k]}</b>`).join(' · ')}
function fxa(f){const o=[];for(const k in f){const v=f[k];if(k in S.res){S.res[k]=Math.max(0,Math.min(k in{food:1,water:1,med:1,tool:1,ammo:1}?99:100,S.res[k]+v));o.push(LB[k]+(v>0?' +':' ')+v)}else{const m=k.match(/^([ay]):(\w+)\.(\w)$/);if(m)S.rel[m[2]][m[1]][m[3]]+=v}}
 if(Object.keys(f).some(k=>k.includes(':')))o.push('관계가 달라졌다');toast(o.join('  '))}
function toast(t){$('#tt').textContent=t;clearTimeout(tt);tt=setTimeout(()=>$('#tt').textContent='',2600)}
function load(id){S.sc=id;const c=CH[S.ch],sc=c.sc[id];S.log=S.log.slice(-200);const{snap,...o}=S;S.snap=JSON.stringify(o);db.s('auto',S.snap);
 let L=(sc.L||[]).filter(l=>!l[2]||(l[2][0]=='!'?!S.fl[l[2].slice(1)]:S.fl[l[2]]));if(id=='start')L=[['','— '+c.t+' —'],...L];
 cur={L,C:sc.C,go:sc.go,i:0};$('#st').style.background=`linear-gradient(${BG[sc.bg||'ruin']})`;bar();wait=false;next()}
function next(){if(wait)return;if(cur.i<cur.L.length)return say(cur.L[cur.i++]);if(cur.C)return ch();cur.go&&cur.go!='$'?load(cur.go):end()}
function say(l){$('#nm').textContent=l[0];$('#tx').textContent=l[1];S.log.push(l);const i=NAMES[l[0]];if(i&&i!='yh')S.met[i]=1;sched()}
function sched(){clearTimeout(T);if(wait)return;if(skip)T=setTimeout(next,45);else if(auto)T=setTimeout(next,1600+$('#tx').textContent.length*45)}
function ch(){wait=true;const d=$('#cs');d.innerHTML='';cur.C.forEach(c=>{const b=document.createElement('button');b.textContent=c.t;if(c.need&&!S.res[c.need]){b.disabled=1;b.textContent+=' (필요: '+LB[c.need]+')'}b.onclick=e=>{e.stopPropagation();pick(c)};d.appendChild(b)})}
function pick(c){$('#cs').innerHTML='';c.fx&&fxa(c.fx);(c.fl||[]).forEach(f=>S.fl[f]=1);bar();skip=0;$('#bs').className='';cur={L:c.r||[],go:c.go,i:0};wait=false;next()}
function end(){if(CH[S.ch+1]){S.ch++;return load('start')}wait=true;clearTimeout(T);
 const r=S.res;db.s('rec',{...(db.g('rec')||{}),trial:1});
 $('#nm').textContent='';$('#tx').textContent=`— 체험판은 여기까지입니다 —\n\n현재 일행: 윤호 외 5명\n식량 ${r.food} · 식수 ${r.water} · 사기 ${r.morale}\n\n(1부 3장부터는 CH 배열에 같은 형식으로 추가)`;
 $('#cs').innerHTML='<button onclick="title()">처음으로</button>'}
function tg(k){if(k=='auto'){auto=!auto;$('#ba').className=auto?'on':''}else{skip=!skip;$('#bs').className=skip?'on':''}sched()}
